[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "social-video-downloader"
version = "0.1.0"
description = "Telegram-first service for downloading media from supported social platforms."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram[i18n]>=3.28,<4",
    "yt-dlp[default]==2026.10.26",
]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
